excluded:
  - RiffMemo.xcodeproj
  - RiffMemoTests
  - RiffMemoUITests

opt_in_rules:
  - empty_count
  - force_unwrapping
  - redundant_type_annotation

disabled_rules:
  - todo

# force_try defaults to `error` severity; downgraded to `warning` so this first-pass
# config surfaces pre-existing violations (3 in the codebase today) without immediately
# failing a `--strict` run. Ratchet back to error once those are cleaned up.
force_try: warning

line_length:
  warning: 150
  error: 300

function_body_length:
  warning: 80
  error: 150

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 1000

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y

custom_rules:
  # WAS-165: titles, file names, paths, and error text must stay private in device logs
  # ("audio stays on this iPhone"). Mark `.public` only on values that identify nothing:
  # counts, durations, states, and `error.logCode`. See Core/Utilities/Logger.swift.
  # Matches one interpolation `\( … privacy: .public)` whose expression names a private
  # kind of value. `error.logCode` is allowed; a bare `error` is not.
  public_log_of_private_value:
    name: "Public log of a private value"
    regex: '(?i)\\\([^\\]*?(title|name|path|url|file|lastpathcomponent|localizeddescription|\berror\b(?!\.logcode))[^\\]*?privacy:\s*\.public'
    message: "Titles, names, paths, URLs, and error text must stay private in logs. Remove `privacy: .public`, or log `error.logCode` instead of the error."
    severity: error
    excluded_match_kinds:
      - comment
      - doccomment
