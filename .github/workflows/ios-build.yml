name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install SwiftLint
      run: which swiftlint || brew install swiftlint

    # .swiftlint.yml lives in RiffMemo/, matching where the build/test steps
    # below already `cd` before invoking xcodebuild. Config thresholds are
    # tuned so a clean run has 0 errors against the current codebase (only
    # warnings) — this fails the job on genuinely new violations without
    # blocking on pre-existing debt.
    - name: Run SwiftLint
      run: |
        cd RiffMemo
        swiftlint lint --reporter github-actions-logging

  build:
    name: Build and Test (${{ matrix.device }})
    # Deliberately NOT macos-26: Xcode 26.x has a known, unresolved hang bug
    # on GitHub-hosted macOS runners (xcodebuild deadlocks after signing,
    # before tests run — see actions/runner-images#13264). macos-15 + Xcode
    # 16.x is the stable combination; the project's deployment target is set
    # accordingly (see IPHONEOS_DEPLOYMENT_TARGET in project.pbxproj). This
    # same class of hang has recurred occasionally even on macos-15 — the
    # timeout below ensures a hang fails the job within minutes instead of
    # silently consuming the default 360-minute job timeout.
    #
    # Concurrency parity (WAS-181): Xcode 16.4 (Swift 6.1) does not know the
    # Swift 6.2 build settings SWIFT_DEFAULT_ACTOR_ISOLATION and
    # SWIFT_APPROACHABLE_CONCURRENCY. It ignores them, so a Mac on Xcode 26+
    # compiled by different rules than CI, and code that built locally failed
    # here. The project no longer sets either one. Until this job runs Xcode
    # 26+, mark actor isolation explicitly (@MainActor or nonisolated) on new
    # types, and do not turn those two settings back on.
    #
    # DEVELOPER_DIR pins the Xcode version instead of taking the runner
    # image's default, which GitHub changes without notice. If the image ever
    # drops this Xcode, the job fails loudly instead of silently compiling by
    # new rules. scripts/ci-parity-build.sh reads this line to build locally
    # with the same Xcode, and CIConcurrencyParityTests fails if the pin goes.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    strategy:
      fail-fast: false
      matrix:
        # Matrixes device model/size class rather than iOS runtime version.
        # The runner image's simulator runtimes change when GitHub updates it
        # (on 2026-11-03 it listed iOS 18.5, 18.6, 26.0, and 26.2). The test
        # step names only the device, so xcodebuild picks the newest runtime
        # that has it. Pinning an exact OS would break when the image drops
        # that runtime. Getting deliberate multi-iOS-version coverage would
        # need a matrix axis for OS plus a check that each runtime exists,
        # which trades reliability for coverage this project doesn't need yet.
        # Device/size-class spread still catches real layout regressions
        # (compact vs. regular width, smallest vs. largest screen).
        device:
          - 'iPhone SE (3rd generation)'
          - 'iPhone 16'
          - 'iPhone 16 Pro Max'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: List available simulators
      run: xcrun simctl list devices available iPhone

    - name: Build for testing
      run: |
        cd RiffMemo
        xcodebuild clean build \
          -project RiffMemo.xcodeproj \
          -scheme RiffMemo \
          -destination 'generic/platform=iOS Simulator' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO

    # `-destination 'generic/platform=iOS Simulator'` only works for building;
    # the `test` action needs a concrete simulator to actually run tests on.
    # Each leg tests on its own `matrix.device`. A hardcoded name here once made
    # all three legs test on iPhone 16 (WAS-115).
    #
    # This step is the project's safety net: it must be allowed to fail the
    # job. Do NOT append `|| true` (or otherwise swallow a non-zero exit)
    # without a specific, documented reason and sign-off — that's what let a
    # broken destination silently mean "tests never ran" for months while CI
    # stayed green.
    #
    # `-parallel-testing-enabled NO`: xcodebuild's default parallel testing
    # splits RiffMemoUITests across simulator clones sharing this runner's
    # limited CPU. Under contention, whichever UI test has the tightest
    # timing margin fails — it rotates between tests run to run (see WAS-104;
    # WAS-103 patched the tests with a configurable timeout, but the
    # contention itself was the real root cause). Serial execution trades a
    # slower run for a stable one.
    #
    # `-skip-testing:RiffMemoUITests/RiffMemoUITests/testLaunchPerformance`:
    # this is a launch-time trend metric (XCTApplicationLaunchMetric), not a
    # correctness check, and has no configurable timeout to widen — it
    # shouldn't gate merges regardless of runner speed.
    - name: Run tests
      run: |
        cd RiffMemo
        xcodebuild test \
          -project RiffMemo.xcodeproj \
          -scheme RiffMemo \
          -destination 'platform=iOS Simulator,name=${{ matrix.device }}' \
          -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
          -parallel-testing-enabled NO \
          -skip-testing:RiffMemoUITests/RiffMemoUITests/testLaunchPerformance \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO

    # A green leg must prove it tested on its own device. WAS-115 found all
    # three legs testing on iPhone 16 while CI stayed green; this step reads
    # the device from the result bundle, so that mistake now fails the leg.
    # The device name goes through `env`, not straight into the script, so its
    # spaces and parentheses never need shell quoting.
    - name: Verify tests ran on ${{ matrix.device }}
      env:
        EXPECTED_DEVICE: ${{ matrix.device }}
      run: |
        xcrun xcresulttool get test-results summary \
          --path "$RUNNER_TEMP/TestResults.xcresult" > "$RUNNER_TEMP/summary.json"
        python3 - "$RUNNER_TEMP/summary.json" <<'PY'
        import json, os, sys
        expected = os.environ["EXPECTED_DEVICE"]
        summary = json.load(open(sys.argv[1]))
        actual = sorted({entry["device"]["deviceName"]
                         for entry in summary.get("devicesAndConfigurations", [])})
        print(f"Expected device: {expected}")
        print(f"Tested on:       {', '.join(actual) or '(none)'}")
        if actual != [expected]:
            print(f"::error::Tests ran on {actual or 'no device'}, not on '{expected}'.")
            sys.exit(1)
        PY

  # Branch protection requires a status check by name, but the matrix job's
  # name embeds the device (`Build and Test (iPhone 16)`, etc.), so adding or
  # renaming a matrix entry silently orphans the old required-check name or
  # leaves a new leg unrequired (see WAS-105). This job is a single stable
  # name — "Build and Test" — that branch protection can require permanently;
  # it just relays the matrix's actual result and never needs updating when
  # the device list changes.
  build-summary:
    name: Build and Test
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Matrix job result: ${{ needs.build.result }}"
            exit 1
          fi
