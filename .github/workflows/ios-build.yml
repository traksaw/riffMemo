name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    # macos-26 ships Xcode 26.x, which is required to build/test against this
    # project's IPHONEOS_DEPLOYMENT_TARGET = 26.1 (macos-15's Xcode tops out
    # around iOS 18.5 and can't resolve a matching simulator).
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: List available simulators
      run: xcrun simctl list devices available iPhone

    - name: Build for testing
      run: |
        cd RiffMemo
        xcodebuild clean build \
          -project RiffMemo.xcodeproj \
          -scheme RiffMemo \
          -destination 'generic/platform=iOS Simulator' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO

    # `-destination 'generic/platform=iOS Simulator'` only works for building;
    # the `test` action needs a concrete simulator to actually run tests on.
    #
    # This step is the project's safety net: it must be allowed to fail the
    # job. Do NOT append `|| true` (or otherwise swallow a non-zero exit)
    # without a specific, documented reason and sign-off — that's what let a
    # broken destination silently mean "tests never ran" for months while CI
    # stayed green.
    - name: Run tests
      run: |
        cd RiffMemo
        xcodebuild test \
          -project RiffMemo.xcodeproj \
          -scheme RiffMemo \
          -destination 'platform=iOS Simulator,name=iPhone 17' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO
